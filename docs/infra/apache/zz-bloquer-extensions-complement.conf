# 15/10/2026 : complement a zz-bloquer-fichiers-sensibles.conf
# Un fichier .vhost etait lisible depuis Internet (constate le 15/10/2026). On bloque d'autres extensions de configuration,
# de journaux, d'archives et d'exports. Sont exclus : /webmail/ (Roundcube) et /.well-known/ (certificats Let's Encrypt).
<LocationMatch "(?i)^(?!/webmail/)(?!/\.well-known/).*\.(vhost|conf|ini|log|gz|rar|7z|old|orig|csv|yml|yaml|key|pem|crt|ps1|xls|xlsx|docx|swp|rej|diff|patch)$">
    Require all denied
</LocationMatch>
