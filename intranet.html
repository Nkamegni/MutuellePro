<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet — Mutuelle Pro Assurances</title>
<meta name="robots" content="noindex, nofollow">
<style>
    :root {
        --navy: #0f172a;
        --purple: #7c3aed;
        --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        background: #f8fafc;
        color: var(--navy);
    }
    header {
        background: var(--navy);
        color: white;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 800; }
    #staff-identite { font-size: 12px; color: #cbd5e1; }
    #btn-deconnexion {
        background: transparent;
        border: 1px solid #475569;
        color: #cbd5e1;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        cursor: pointer;
        margin-left: 12px;
    }
    #btn-deconnexion:hover { background: #1e293b; }

    #vue-login {
        max-width: 380px;
        margin: 80px auto;
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    #vue-login h2 { font-size: 16px; margin: 0 0 20px; }
    #vue-login label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #475569; }
    #vue-login input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
    }
    #vue-login button {
        width: 100%;
        background: var(--purple);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
    }
    #vue-login button:hover { background: #6d28d9; }
    #login-erreur { color: #dc2626; font-size: 12px; margin-top: 10px; display: none; }

    #vue-dashboard { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
    .filtres { display: flex; gap: 10px; margin-bottom: 16px; }
    .filtres select {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
    }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; font-weight: 700; color: #475569; font-size: 11px; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid;
    }
    .badge-recu { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .badge-en_cours { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .badge-resolu { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    #chargement, #vide { text-align: center; padding: 40px; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>

<header>
    <h1><img src="/Logo_MPRO.png" alt="Mutuelle Pro Assurances" style="height:28px; width:auto; background:white; border-radius:6px; padding:2px 6px; vertical-align:middle; margin-right:8px;"> Intranet</h1>
    <div>
        <span id="staff-identite"></span>
        <button id="btn-changer-mdp" onclick="ouvrirChangementMdp()" style="display:none; background:transparent; border:1px solid #475569; color:#cbd5e1; padding:6px 12px; border-radius:8px; font-size:11px; cursor:pointer; margin-left:8px;">Changer mon mot de passe</button>
        <button id="btn-deconnexion" onclick="staffDeconnexion()" style="display:none;">Se déconnecter</button>
    </div>
</header>

<!-- ===== VUE CONNEXION ===== -->
<div id="vue-login">
    <h2>Connexion Espace Collaborateur</h2>
    <form id="form-login">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" required autocomplete="current-password">
        <button type="submit">Se connecter</button>
        <p id="login-erreur"></p>
    </form>
</div>

<!-- ===== VUE TABLEAU DE BORD ===== -->
<div id="vue-dashboard">
    <div class="filtres">
        <select id="filtre-statut" onchange="chargerTickets()">
            <option value="">Tous les statuts</option>
            <option value="recu">Reçu</option>
            <option value="en_cours">En cours</option>
            <option value="resolu">Résolu</option>
        </select>
        <select id="filtre-type" onchange="chargerTickets()">
            <option value="">Tous les types</option>
            <option value="info">Information</option>
            <option value="devis">Devis</option>
            <option value="sinistre">Sinistre</option>
        </select>
    </div>
    <div id="chargement">Chargement…</div>
    <table id="table-tickets" style="display:none;">
        <thead>
            <tr>
                <th>Référence</th>
                <th>Type</th>
                <th>Statut</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Compte</th>
                <th>Assigné à</th>
                <th>Créé le</th>
            </tr>
        </thead>
        <tbody id="corps-table"></tbody>
    </table>
    <div id="vide" style="display:none;">Aucun ticket ne correspond à ces filtres.</div>
</div>

<!-- ===== MODALE CHANGEMENT DE MOT DE PASSE ===== -->
<div id="modal-changer-mdp" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:100; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:16px; padding:28px; max-width:380px; width:90%; box-shadow:0 4px 20px rgba(0,0,0,0.15);">
        <h3 style="font-size:15px; margin:0 0 16px; color:#0f172a;">Changer mon mot de passe</h3>
        <form id="form-changer-mdp">
            <label style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#475569;">Mot de passe actuel</label>
            <input type="password" id="mdp-actuel" required style="width:100%; padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:14px; font-size:14px; box-sizing:border-box;">

            <label style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#475569;">Nouveau mot de passe (10 car. min., 1 lettre, 1 chiffre, 1 caractère spécial)</label>
            <input type="password" id="mdp-nouveau" required minlength="10" style="width:100%; padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:14px; font-size:14px; box-sizing:border-box;">

            <label style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#475569;">Confirmer le nouveau mot de passe</label>
            <input type="password" id="mdp-confirm" required style="width:100%; padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:16px; font-size:14px; box-sizing:border-box;">

            <div style="display:flex; gap:8px;">
                <button type="button" onclick="fermerChangementMdp()" style="flex:1; background:#f1f5f9; color:#475569; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">Annuler</button>
                <button type="submit" style="flex:1; background:#7c3aed; color:white; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;">Valider</button>
            </div>
        </form>
        <p id="message-changer-mdp" style="font-size:12px; margin-top:10px; display:none;"></p>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // Intranet — Phase 2a + 2b (20-21/08/2026). Changement de statut et
    // assignation réservés aux rôles Gestionnaire/Administrateur (matrice
    // RBAC §1.3 du CDCF) — contrôle appliqué ici pour l'affichage, mais
    // TOUJOURS revérifié côté serveur (requireStaffRole), jamais fait
    // confiance au seul contrôle client.
    // Session staff totalement distincte de la session client (cookie
    // "connect.sid.staff", voir server.js) : ce fichier ne partage
    // aucun état avec index.html.
    // -------------------------------------------------------------

    const ROLES_ECRITURE = ['gestionnaire', 'administrateur'];
    let roleActuel = null;
    let listeAgents = [];

    async function verifierSession() {
        try {
            const resp = await fetch('/api/staff/session', { credentials: 'include' });
            if (resp.status === 200) {
                const data = await resp.json();
                afficherDashboard(data);
                return;
            }
        } catch (err) {
            console.error('Erreur de vérification de session staff :', err);
        }
        afficherLogin();
    }

    function afficherLogin() {
        document.getElementById('vue-login').style.display = 'block';
        document.getElementById('vue-dashboard').style.display = 'none';
        document.getElementById('btn-deconnexion').style.display = 'none';
        document.getElementById('btn-changer-mdp').style.display = 'none';
        document.getElementById('staff-identite').textContent = '';
    }

    function afficherDashboard(session) {
        document.getElementById('vue-login').style.display = 'none';
        document.getElementById('vue-dashboard').style.display = 'block';
        document.getElementById('btn-deconnexion').style.display = 'inline-block';
        document.getElementById('btn-changer-mdp').style.display = 'inline-block';
        document.getElementById('staff-identite').textContent = `Rôle : ${session.code_role || ''}`;
        roleActuel = session.code_role || null;
        chargerAgents();
        chargerTickets();
    }

    async function chargerAgents() {
        try {
            const resp = await fetch('/api/staff/agents', { credentials: 'include' });
            const data = await resp.json();
            if (data.succes) listeAgents = data.agents;
        } catch (err) {
            console.error('Erreur de chargement des agents :', err);
        }
    }

    document.getElementById('form-login').addEventListener('submit', async function (event) {
        event.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const mot_de_passe = document.getElementById('login-password').value;
        const erreurEl = document.getElementById('login-erreur');
        erreurEl.style.display = 'none';

        try {
            const resp = await fetch('/api/staff/connexion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, mot_de_passe }),
            });
            const data = await resp.json();
            if (!data.succes) {
                erreurEl.textContent = (data.erreurs && data.erreurs[0]) || 'Erreur de connexion.';
                erreurEl.style.display = 'block';
                return;
            }
            afficherDashboard(data.staff);
        } catch (err) {
            console.error('Erreur de connexion staff :', err);
            erreurEl.textContent = 'Erreur réseau, veuillez réessayer.';
            erreurEl.style.display = 'block';
        }
    });

    async function staffDeconnexion() {
        try {
            await fetch('/api/staff/deconnexion', { method: 'POST', credentials: 'include' });
        } catch (err) {
            console.error('Erreur de déconnexion staff :', err);
        }
        afficherLogin();
    }

    function ouvrirChangementMdp() {
        document.getElementById('modal-changer-mdp').style.display = 'flex';
    }
    function fermerChangementMdp() {
        document.getElementById('modal-changer-mdp').style.display = 'none';
        document.getElementById('form-changer-mdp').reset();
        const msg = document.getElementById('message-changer-mdp');
        msg.style.display = 'none';
    }

    document.getElementById('form-changer-mdp').addEventListener('submit', async function (event) {
        event.preventDefault();
        const msg = document.getElementById('message-changer-mdp');
        const mot_de_passe_actuel = document.getElementById('mdp-actuel').value;
        const nouveau_mot_de_passe = document.getElementById('mdp-nouveau').value;
        const nouveau_mot_de_passe_confirmation = document.getElementById('mdp-confirm').value;

        if (nouveau_mot_de_passe !== nouveau_mot_de_passe_confirmation) {
            msg.textContent = 'La confirmation ne correspond pas.';
            msg.style.cssText = 'font-size:12px; margin-top:10px; display:block; color:#dc2626;';
            return;
        }

        try {
            const resp = await fetch('/api/staff/changer-mot-de-passe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ mot_de_passe_actuel, nouveau_mot_de_passe, nouveau_mot_de_passe_confirmation }),
            });
            const data = await resp.json();
            if (!data.succes) {
                msg.textContent = (data.erreurs && data.erreurs[0]) || 'Erreur, veuillez réessayer.';
                msg.style.cssText = 'font-size:12px; margin-top:10px; display:block; color:#dc2626;';
                return;
            }
            msg.textContent = 'Mot de passe changé avec succès.';
            msg.style.cssText = 'font-size:12px; margin-top:10px; display:block; color:#047857;';
            setTimeout(fermerChangementMdp, 1500);
        } catch (err) {
            console.error('Erreur de changement de mot de passe :', err);
            msg.textContent = 'Erreur réseau.';
            msg.style.cssText = 'font-size:12px; margin-top:10px; display:block; color:#dc2626;';
        }
    });

    async function chargerTickets() {
        const statut = document.getElementById('filtre-statut').value;
        const type = document.getElementById('filtre-type').value;
        const params = new URLSearchParams();
        if (statut) params.set('statut', statut);
        if (type) params.set('type', type);

        const chargementEl = document.getElementById('chargement');
        const tableEl = document.getElementById('table-tickets');
        const videEl = document.getElementById('vide');
        chargementEl.style.display = 'block';
        tableEl.style.display = 'none';
        videEl.style.display = 'none';

        try {
            const resp = await fetch(`/api/staff/tickets?${params.toString()}`, { credentials: 'include' });
            if (resp.status === 401) { afficherLogin(); return; }
            const data = await resp.json();
            chargementEl.style.display = 'none';

            if (!data.succes || !data.tickets || data.tickets.length === 0) {
                videEl.style.display = 'block';
                return;
            }

            const corps = document.getElementById('corps-table');
            const peutEcrire = ROLES_ECRITURE.includes(roleActuel);

            const optionsStatut = [
                { code: 'recu', libelle: 'Reçu' },
                { code: 'en_cours', libelle: 'En cours' },
                { code: 'resolu', libelle: 'Résolu' },
            ];

            corps.innerHTML = data.tickets.map((t) => {
                const dateStr = new Date(t.date_creation).toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                const celluleStatut = peutEcrire
                    ? `<select onchange="changerStatut(${t.id_ticket}, this.value)" style="font-size:12px; padding:4px 6px; border-radius:6px; border:1px solid #e5e7eb;">
                        ${optionsStatut.map(o => `<option value="${o.code}" ${o.code === t.code_statut_ticket ? 'selected' : ''}>${o.libelle}</option>`).join('')}
                       </select>`
                    : `<span class="badge badge-${t.code_statut_ticket}">${t.statut_libelle_fr}</span>`;

                const celluleAssignation = peutEcrire
                    ? `<select onchange="changerAssignation(${t.id_ticket}, this.value)" style="font-size:12px; padding:4px 6px; border-radius:6px; border:1px solid #e5e7eb;">
                        <option value="">Non assigné</option>
                        ${listeAgents.map(a => `<option value="${a.id_staff}" ${a.id_staff === t.id_staff_assigne ? 'selected' : ''}>${a.nom_complet}</option>`).join('')}
                       </select>`
                    : (t.staff_assigne_nom || '—');

                return `
                    <tr>
                        <td><strong>${t.code_ticket}</strong></td>
                        <td>${t.type_libelle_fr}</td>
                        <td>${celluleStatut}</td>
                        <td>${t.email_contact}</td>
                        <td>${t.telephone_contact}</td>
                        <td>${t.compte_email ? '✅ ' + t.compte_email + (roleActuel === 'administrateur' && t.id_utilisateur ? ` <a href="#" onclick="event.preventDefault(); anonymiserClient(${t.id_utilisateur});" style="color:#dc2626; font-size:10px;" title="Anonymiser ce client (RGPD)">🗑️</a>` : '') : '—'}</td>
                        <td>${celluleAssignation}</td>
                        <td>${dateStr}</td>
                    </tr>
                `;
            }).join('');
            tableEl.style.display = 'table';
        } catch (err) {
            console.error('Erreur de chargement des tickets :', err);
            chargementEl.textContent = 'Erreur de chargement.';
        }
    }

    async function changerStatut(idTicket, codeStatut) {
        try {
            const resp = await fetch(`/api/staff/tickets/${idTicket}/statut`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ code_statut_ticket: codeStatut }),
            });
            const data = await resp.json();
            if (!data.succes) {
                alert((data.erreurs && data.erreurs[0]) || 'Erreur lors du changement de statut.');
                chargerTickets(); // recharge pour annuler visuellement le changement refusé
                return;
            }
            chargerTickets();
        } catch (err) {
            console.error('Erreur de changement de statut :', err);
            alert('Erreur réseau.');
        }
    }

    async function anonymiserClient(idUtilisateur) {
        const confirmation = window.confirm(
            "Anonymiser définitivement ce client (email/téléphone effacés, compte suspendu) ?\n" +
            "Les tickets restent visibles à des fins statistiques, mais leurs coordonnées de contact seront aussi effacées.\n" +
            "Cette action est IRRÉVERSIBLE."
        );
        if (!confirmation) return;

        try {
            const resp = await fetch(`/api/staff/clients/${idUtilisateur}/anonymiser`, {
                method: 'POST',
                credentials: 'include',
            });
            const data = await resp.json();
            if (!data.succes) {
                alert((data.erreurs && data.erreurs[0]) || "Erreur lors de l'anonymisation.");
                return;
            }
            alert('Client anonymisé avec succès.');
            chargerTickets();
        } catch (err) {
            console.error('Erreur d\'anonymisation :', err);
            alert('Erreur réseau.');
        }
    }

    async function changerAssignation(idTicket, idStaffStr) {
        const id_staff = idStaffStr === '' ? null : parseInt(idStaffStr, 10);
        try {
            const resp = await fetch(`/api/staff/tickets/${idTicket}/assignation`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ id_staff }),
            });
            const data = await resp.json();
            if (!data.succes) {
                alert((data.erreurs && data.erreurs[0]) || "Erreur lors de l'assignation.");
                chargerTickets();
                return;
            }
            chargerTickets();
        } catch (err) {
            console.error('Erreur d\'assignation :', err);
            alert('Erreur réseau.');
        }
    }

    verifierSession();
</script>

</body>
</html>
